services:
  courier-mysql:
    image: mysql:8.1
    container_name: courier-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE_NAME:-courier_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3309}:3306"

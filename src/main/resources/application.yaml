spring:
  config:
    import: "optional:configserver:"
  datasource:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_DATABASE_NAME:courier_db}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


